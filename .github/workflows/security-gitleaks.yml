# ──────────────────────────────────────────────────────────────────────────────
# Security CI — Gitleaks Secret Scanner
#
# Prevents credentials, API keys, and sensitive tokens from entering the
# repository across Pull Requests and pushes to main.
#
# Runs standalone Gitleaks binary with .gitleaks.toml configuration.
# ──────────────────────────────────────────────────────────────────────────────
name: Security - Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VER="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks detection
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Scanning PR commits against base ${{ github.base_ref }}..."
            gitleaks detect --config=.gitleaks.toml --verbose --redact --log-opts="origin/${{ github.base_ref }}..HEAD"
          else
            echo "Scanning recent commits..."
            gitleaks detect --config=.gitleaks.toml --verbose --redact
          fi
